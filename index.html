<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        /* Matches Instagram's dark/light neutral loading tone so it looks completely natural */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        const EBAY_STORE_URL = "https://ebay.com"; 

        // Check visitor country location
        fetch('https://ipapi.co')
            .then(response => response.json())
            .then(data => {
                const detectedCountry = (data.country_code || data.country || '').toUpperCase();

                if (detectedCountry === 'IN') {
                    // Visitor is in India -> Do absolutely nothing. 
                    // The page remains blank and static, keeping them inside Instagram.
                    console.log("Local traffic blocked.");
                } else {
                    // Visitor is Outside India -> Instantly forward to your eBay store
                    window.location.href = EBAY_STORE_URL;
                }
            })
            .catch(error => {
                console.error("Lookup error:", error);
                // Security Fallback: If tracking is completely blocked, stay on the blank page to be safe
            });
    </script>
</body>
</html>
