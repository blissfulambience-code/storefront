<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Shop...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Verifying your region to route you to the correct store...</p>

    <script>
        // Target destination configurations
        const EBAY_STORE_URL = "https://www.ebay.com/str/divineaura/Men-ethnic-Jutti/_i.html?store_cat=44357999016"; 
        const INSTAGRAM_DM_URL = "https://ig.me"; 

        // Execute precise tracking fetch with formatting parameters
        fetch('https://ipapi.co')
            .then(response => response.json())
            .then(data => {
                if (data.country === 'IN' || data.country_code === 'IN') {
                    // Location Confirmed: India -> Open DM screen directly
                    window.location.href = INSTAGRAM_DM_URL;
                } else {
                    // Location Confirmed: International -> Route straight to eBay listing
                    window.location.href = EBAY_STORE_URL;
                }
            })
            .catch(error => {
                console.error("Location lookup encounter:", error);
                // Security Fallback: Route to DMs if browser privacy extensions block the script
                window.location.href = INSTAGRAM_DM_URL;
            });
    </script>
</body>
</html>
