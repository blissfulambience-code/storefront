<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        // Set your store as the primary destination
        const INTERNATIONAL_STORE_URL = "https://ebay.com";
        const INDIA_URL = "https://ebay.com";

        // Query Cloudflare's instant trace system (never gets blocked or throttled)
        fetch('https://cloudflare.com')
            .then(response => response.text())
            .then(data => {
                // Extract the exact country code line from Cloudflare's text block
                const lines = data.split('\n');
                let countryCode = '';
                
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].startsWith('loc=')) {
                        countryCode = lines[i].split('=')[1].toUpperCase();
                        break;
                    }
                }

                if (countryCode === 'IN') {
                    // Confirmed India traffic -> Route to base eBay
                    window.location.replace(INDIA_URL);
                } else {
                    // Everyone else (US, UK, CA, etc.) -> Route straight to your store
                    window.location.replace(INTERNATIONAL_STORE_URL);
                }
            })
            .catch(error => {
                console.warn("Trace failed, falling back to international store default.");
                // CRITICAL FIX: If anything blocks the script, default to your store instead of the home page!
                window.location.replace(INTERNATIONAL_STORE_URL);
            });
    </script>
</body>
</html>
