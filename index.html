<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambience Crafts</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            color: #333; 
            background-color: #fafafa;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .logo-placeholder {
            font-size: 24px;
            font-weight: bold;
            color: #b58d3d;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p { 
            font-size: 16px; 
            line-height: 1.5; 
            color: #666;
            margin-bottom: 25px; 
        }
        .btn { 
            display: block; 
            background-color: #25D366; 
            color: #ffffff; 
            padding: 14px 20px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #20ba5a; }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #b58d3d; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #local-view { display: none; }
    </style>
</head>
<body>

    <div id="loading-view">
        <div class="spinner"></div>
        <p>Verifying your region to route you to the correct store...</p>
    </div>

    <div id="local-view" class="container">
        <div class="logo-placeholder">AMBIENCE CRAFTS</div>
        <p>Our online store selections are currently exclusive to destinations outside India. For local orders and queries, tap below to message us directly on WhatsApp!</p>
        <a href="#" id="whatsapp-link" class="btn">Message on WhatsApp</a>
    </div>

    <script>
        const EBAY_STORE_URL = "https://ebay.com"; 
        
        // ⚠️ CHANGE ONLY THIS LINE: Paste your digits inside the quotes below.
        // No spaces, no hyphens, no plus sign (+). Just pure numbers.
        const BUSINESS_PHONE_NUMBER = "91XXXXXXXXXX"; 

        // Safely generate the clean WhatsApp API text link configuration
        const encodedText = encodeURIComponent("Hi Ambience Crafts! I saw your profile on Instagram and want to inquire about ordering Men Ethnic Juttis.");
        document.getElementById("whatsapp-link").href = `https://whatsapp.com{BUSINESS_PHONE_NUMBER}&text=${encodedText}`;

        // Fetch location data from alternative clear database
        fetch('https://ipapi.co')
            .then(response => response.json())
            .then(data => {
                // FIXED: Normalizes response text strings to absolute uppercase
                const detectedCountry = (data.country_code || data.country || '').toUpperCase();

                if (detectedCountry === 'IN') {
                    // Verified Indian User -> Turn off loader and present WhatsApp interface
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('local-view').style.display = 'block';
                } else {
                    // Verified Overseas User -> Seamless bounce straight onto your eBay catalog
                    window.location.href = EBAY_STORE_URL;
                }
            })
            .catch(error => {
                console.error("Location lookup failure:", error);
                // Security Fallback: Default to your local WhatsApp page view if script encounters a block
                document.getElementById('loading-view').style.display = 'none';
                document.getElementById('local-view').style.display = 'block';
            });
    </script>
</body>
</html>
