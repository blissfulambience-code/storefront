<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divine Aura</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b0b0c;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .box {
    max-width: 420px;
    padding: 32px 24px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #b5b5b5;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #333;
    border-top-color: #f2f2f2;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="box">
  <div id="loading">
    <div class="spinner"></div>
    <p>Checking availability…</p>
  </div>

  <div id="blocked" class="hidden">
    <h1>Divine Aura</h1>
    <p>Sorry — this store currently ships internationally only and isn't available to visitors in India.</p>
  </div>

  <div id="fallback" class="hidden">
    <h1>Divine Aura</h1>
    <p>Redirecting you to the store…</p>
    <p><a href="https://www.ebay.com/str/divineaura" style="color:#9cdcfe;">Tap here if you're not redirected automatically</a></p>
  </div>
</div>

<script>
  const EBAY_URL = "https://www.ebay.com/str/divineaura";
  const BLOCKED_COUNTRY = "IN"; // India

  const loadingEl = document.getElementById('loading');
  const blockedEl = document.getElementById('blocked');
  const fallbackEl = document.getElementById('fallback');

  function showBlocked() {
    loadingEl.classList.add('hidden');
    blockedEl.classList.remove('hidden');
  }

  function redirectToEbay() {
    window.location.replace(EBAY_URL);
  }

  // Primary geolocation lookup, with a couple of fallbacks in case one API is down.
  async function getCountryCode() {
    const providers = [
      { url: "https://ipapi.co/json/", extract: d => d.country_code },
      { url: "https://ipwho.is/", extract: d => d.country_code },
      { url: "https://get.geojs.io/v1/ip/country.json", extract: d => d.country }
    ];

    for (const provider of providers) {
      try {
        const res = await fetch(provider.url, { cache: "no-store" });
        if (!res.ok) continue;
        const data = await res.json();
        const code = provider.extract(data);
        if (code) return code.toUpperCase();
      } catch (e) {
        continue; // try next provider
      }
    }
    return null; // all providers failed
  }

  (async () => {
    const country = await getCountryCode();

    if (country === BLOCKED_COUNTRY) {
      showBlocked();
    } else if (country) {
      redirectToEbay();
    } else {
      // Couldn't determine location — show a manual link rather than
      // silently blocking a legitimate international visitor.
      loadingEl.classList.add('hidden');
      fallbackEl.classList.remove('hidden');
      setTimeout(redirectToEbay, 1500);
    }
  })();
</script>

</body>
</html>
