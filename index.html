<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        /* Transparent layout that loads smoothly inside the Instagram app browser */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        const INDIA_URL = "https://www.ebay.com";
        const INTERNATIONAL_STORE_URL = "https://www.ebay.com/str/divineaura";

        // Instantly scans the visitor's network location parameters 
        fetch('https://ip-api.com')
            .then(response => response.json())
            .then(data => {
                const country = (data.countryCode || '').toUpperCase();

                if (country === 'IN') {
                    // Verified Indian Network -> Open generic eBay homepage
                    window.location.replace(INDIA_URL);
                } else {
                    // Verified Overseas Network -> Open Cosmopolitan Aura storefront
                    window.location.replace(INTERNATIONAL_STORE_URL);
                }
            })
            .catch(error => {
                console.error("Routing error encountered:", error);
                // Security Backup: Automatically routes to your store if an ad-blocker stops the scanner
                window.location.replace(INTERNATIONAL_STORE_URL);
            });
    </script>
</body>
</html>
