<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        /* Blends cleanly with the Instagram in-app browser interface background */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        const EBAY_STORE_URL = "https://www.ebay.com/str/divineaura";

        // Querying ip-api.com which is fully compatible with international testing bots
        fetch('https://ip-api.com')
            .then(response => response.json())
            .then(data => {
                // Ensure country code formatting is read cleanly as uppercase (e.g., "IN" or "US")
                const country = (data.countryCode || '').toUpperCase();

                if (country === 'IN') {
                    // Visitor is inside India: Terminate everything and keep page completely blank
                    console.log("Traffic stopped for India.");
                } else {
                    // Visitor is outside India (USA, UK, etc.): Send straight to your eBay store front
                    window.location.replace(EBAY_STORE_URL);
                }
            })
            .catch(error => {
                console.error("Routing error:", error);
                // Security Backup: Keep page blank if tracking is completely blocked by user settings
            });
    </script>
</body>
</html>
