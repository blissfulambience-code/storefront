<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambience Crafts</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            color: #333; 
            background-color: #fafafa;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .logo-placeholder {
            font-size: 24px;
            font-weight: bold;
            color: #b58d3d;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p { 
            font-size: 16px; 
            line-height: 1.5; 
            color: #666;
            margin-bottom: 25px; 
        }
        .btn { 
            display: block; 
            background-color: #25D366; 
            color: #ffffff; 
            padding: 14px 20px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #20ba5a; }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #b58d3d; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #local-view { display: none; }
    </style>
</head>
<body>

    <div id="loading-view">
        <div class="spinner"></div>
        <p>Verifying your region to route you to the correct store...</p>
    </div>

    <div id="local-view" class="container">
        <div class="logo-placeholder">AMBIENCE CRAFTS</div>
        <p>Our online store selections are currently exclusive to destinations outside India. For local orders and queries, tap below to message us directly on WhatsApp!</p>
        <a href="#" id="whatsapp-link" class="btn">Message on WhatsApp</a>
    </div>

    <script>
        // Exact Men's Ethnic Jutti collection link mapped out explicitly
        const EBAY_STORE_URL = "https://www.ebay.com/str/divineaura/Men-ethnic-Jutti/_i.html?store_cat=44357999016"; 
        
        // ⚠️ CRITICAL STEP: Put ONLY your numbers inside the quotes below. 
        // No spaces, no dashes, no + sign. (Example: "919876543210")
        const BUSINESS_PHONE_NUMBER = "917021662266"; 

        // Automatically format and encode the clean WhatsApp text link parameters
        const encodedText = encodeURIComponent("Hi Ambience Crafts! I saw your profile on Instagram and want to inquire about ordering Men Ethnic Juttis.");
        document.getElementById("whatsapp-link").href = `https://whatsapp.com{BUSINESS_PHONE_NUMBER}&text=${encodedText}`;

        // Secondary fallback checking engine using Cloudflare's server parameters directly
        function checkFallback() {
            fetch('https://cloudflare.com')
                .then(res => res.text())
                .then(text => {
                    const countryLine = text.split('\n').find(line => line.startsWith('loc='));
                    const code = countryLine ? countryLine.split('=')[1] : '';
                    if (code.toUpperCase() === 'IN') {
                        showLocal();
                    } else {
                        window.location.href = EBAY_STORE_URL;
                    }
                })
                .catch(() => {
                    // Ultimate backup: Default to local view if completely offline or stuck
                    showLocal();
                });
        }

        function showLocal() {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('local-view').style.display = 'block';
        }

        // Primary location lookup engine
        fetch('https://ipapi.co')
            .then(response => response.json())
            .then(data => {
                const detectedCountry = (data.country_code || data.country || '').toUpperCase();
                if (detectedCountry === 'IN') {
                    showLocal();
                } else {
                    window.location.href = EBAY_STORE_URL;
                }
            })
            .catch(error => {
                console.warn("Primary tracking hit a block, waking up Cloudflare engine...");
                checkFallback();
            });
    </script>
</body>
</html>
