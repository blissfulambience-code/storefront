<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        /* Matches Instagram's default browser interface backdrop style */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        // Use the absolute shop catalog parameters to prevent eBay's server block
        const EBAY_STORE_URL = "https://ebay.com";

        fetch('https://country.is')
            .then(response => response.json())
            .then(data => {
                const country = (data.country || '').toUpperCase();

                if (country === 'IN') {
                    // Confirmed Indian traffic -> Leave the screen completely empty
                    console.log("Domestic traffic held.");
                } else {
                    // Confirmed International traffic -> Trigger safe natural frame push
                    setTimeout(function() {
                        window.location.replace(EBAY_STORE_URL);
                    }, 100);
                }
            })
            .catch(error => {
                console.error("Tracking error logic:", error);
                // System Block Backup: Stay blank for local protection rules
            });
    </script>
</body>
</html>
