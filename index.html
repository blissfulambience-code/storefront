<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        /* Neutral look to make it blend invisibly inside Instagram's internal browser app */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        const EBAY_STORE_URL = "https://ebay.com";

        // Querying an alternative lookup engine built to handle unrestricted free traffic 
        fetch('https://api.country.is')
            .then(response => response.json())
            .then(data => {
                const country = (data.country || '').toUpperCase();

                if (country === 'IN') {
                    // Confirmed India: Completely terminates execution, keeping the screen blank
                    console.log("Domestic traffic held.");
                } else {
                    // Outside India (US, UK, etc.): Instant forwarding step execution
                    window.location.href = EBAY_STORE_URL;
                }
            })
            .catch(error => {
                console.error("Traffic handler fallback trigger:", error);
                // System Error Backup: Default to the blank page for optimal local safety
            });
    </script>
</body>
</html>
