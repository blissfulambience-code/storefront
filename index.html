<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Store...</title>
    <style>
        /* Invisible background matching the default Instagram browse window layout */
        body { 
            background-color: #fafafa; 
            margin: 0; 
            padding: 0; 
        }
    </style>
</head>
<body>

    <script>
        // Exact URLs configured for your specified destinations
        const INDIA_URL = "https://www.ebay.com";
        const INTERNATIONAL_STORE_URL = "https://www.ebay.com/str/divineaura";

        // Querying an ultra-compatible, unblockable free location endpoint
        fetch('https://freeipapi.com')
            .then(response => response.json())
            .then(data => {
                // Read and format the country code string values clearly
                const country = (data.countryCode || '').toUpperCase();

                if (country === 'IN') {
                    // Visitor inside India -> Route to basic eBay homepage
                    window.location.replace(INDIA_URL);
                } else {
                    // Visitor outside India -> Route to your custom store
                    window.location.replace(INTERNATIONAL_STORE_URL);
                }
            })
            .catch(error => {
                console.error("Routing process warning:", error);
                // System Safety Backup: Fallback to the main eBay homepage if data center blocks lookups
                window.location.replace(INDIA_URL);
            });
    </script>
</body>
</html>
